<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Images</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; }
    main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; max-width: 1200px; margin: auto; }
    img { display: block; width: 100%; height: auto; }
    @media (max-width: 600px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <img src="GettyImages.jpg" alt="Orange flowers floating in turquoise water" width="740" height="740">
    <img src="istockphoto.jpg" alt="Close-up of an eye surrounded by colorful powder" width="612" height="408">
  </main>
</body>
</html>
